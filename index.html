<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Igreja EMUNAH</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">


<style>

/* RESET */

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}


body{

background:#050505;
color:white;

overflow:hidden;

}



/* ==========================
MODAL DE ENTRADA
========================== */


.modal{

position:fixed;

top:0;
left:0;

width:100%;
height:100vh;

background:rgba(0,0,0,.88);

display:flex;

align-items:center;
justify-content:center;

z-index:9999;

}



.modal-box{

width:90%;

max-width:520px;

background:#111;

border-radius:25px;

padding:25px;

text-align:center;

box-shadow:
0 0 50px rgba(212,175,55,.25);

animation:abrir .8s ease;

}



@keyframes abrir{

from{

transform:scale(.7);

opacity:0;

}

to{

transform:scale(1);

opacity:1;

}

}



.modal-box h1{

font-size:28px;

font-weight:800;

margin-bottom:20px;

background:linear-gradient(45deg,#fff,#d4af37);

-webkit-background-clip:text;

color:transparent;

}



.modal-box video{

width:100%;

height:280px;

object-fit:cover;

border-radius:18px;

background:#000;

}



/* BOTÃO DO VÍDEO */

#botaoCultos{

display:none;

margin-top:20px;

width:100%;

padding:16px;

border:none;

border-radius:50px;

background:#d4af37;

color:#000;

font-size:16px;

font-weight:800;

cursor:pointer;

transition:.3s;

}



#botaoCultos:hover{

transform:scale(1.05);

}



/* ==========================
HEADER
========================== */


header{

position:fixed;

top:0;

left:0;

width:100%;

padding:20px 8%;

display:flex;

justify-content:space-between;

align-items:center;

background:rgba(0,0,0,.65);

backdrop-filter:blur(10px);

z-index:1000;

}



.logo{

font-size:25px;

font-weight:800;

color:#d4af37;

}



nav a{

color:white;

text-decoration:none;

margin-left:20px;

font-size:14px;

}




/* ==========================
HERO
========================== */


.hero{

height:100vh;

background:

linear-gradient(
rgba(0,0,0,.55),
rgba(0,0,0,.85)
),

url("imagem-fundo.jpg");


background-size:cover;

background-position:center;

display:flex;

align-items:center;

justify-content:center;

text-align:center;

}



.hero-text{

max-width:700px;

}



.hero h2{

font-size:45px;

font-weight:800;

}



.hero p{

font-size:20px;

color:#ddd;

margin:20px 0;

}



.hero a{

display:inline-block;

padding:15px 35px;

background:#d4af37;

color:#000;

border-radius:50px;

text-decoration:none;

font-weight:bold;

}


/* TÍTULOS */

.titulo{

text-align:center;

font-size:35px;

margin:70px 0 40px;

}
