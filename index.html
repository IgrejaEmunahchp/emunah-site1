<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMUNAH - Igreja</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#000;
    color:#fff;
    text-align:center;
    overflow-x:hidden;
}

canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

#site{
    max-width:520px;
    margin:auto;
    padding:70px 18px;
}

.logo{
    width:170px;
    border-radius:20px;
    margin-bottom:20px;
    box-shadow:0 10px 40px rgba(255,215,0,.4);
}

h1{
    color:gold;
    letter-spacing:3px;
    margin-bottom:10px;
}

.clock,
.countdown{
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
    padding:12px;
    border-radius:15px;
    margin-bottom:15px;
}

.card{
    position:relative;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(18px);
    border-radius:22px;
    padding:22px;
    margin:18px 0;
    cursor:pointer;
    transition:.4s;
    animation:fadeUp .7s ease forwards;
}

.card:hover{
    transform:translateY(-6px);
}

.card img{
    width:100%;
    border-radius:18px;
    margin-top:15px;
    display:none;
    opacity:0;
    transform:scale(.95);
    transition:.5s;
}

.card img.show{
    display:block;
    opacity:1;
    transform:scale(1);
}

.badge{
    position:absolute;
    top:-10px;
    right:-10px;
    background:gold;
    color:#000;
    font-weight:700;
    border-radius:20px;
    padding:6px 12px;
}

.player{
    position:fixed;
    bottom:20px;
    left:20px;
    background:rgba(0,0,0,.8);
    padding:15px 20px;
    border-radius:50px;
    box-shadow:0 0 20px rgba(255,215,0,.5);
}

.player button{
    background:gold;
    border:none;
    padding:8px 15px;
    border-radius:20px;
    font-weight:600;
    cursor:pointer;
}

.whatsapp{
    position:fixed;
    bottom:20px;
    right:20px;
    width:65px;
    height:65px;
    background:#25D366;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    box-shadow:0 0 25px rgba(37,211,102,.8);
}

.whatsapp img{
    width:35px;
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div id="site">

<img src="IMG-20260319-WA0002.jpg" class="logo">

<h1>IGREJA EMUNAH</h1>

<div class="clock" id="clock">
Carregando horário...
</div>

<div class="countdown" id="countdown">
Próximo culto...
</div>

<div class="card" onclick="toggleCard(this)">
    <div class="badge">NOVIDADE</div>
    📖 Terça - Minha família no altar (20:00 Horas - BR)

    <img src="d1336394ddf2495e894e5c1ad077bb32.jpg">
</div>

<div class="card">
    🙏 Quarta - Oração e ensaio (20:00 Horas - BR)
</div>

<div class="card">
    🔥 Quinta - Culto de libertação
</div>

<div class="card">
    🎶 Sábado - Culto
</div>

<div class="card">
    ✨ Domingo - Culto
</div>

</div>

<div class="player">
    🎵 Louvor
    <button id="musicBtn" onclick="toggleMusic()">
        Play
    </button>
</div>

<audio id="audio" loop>
    <source src="louvor.mp3" type="audio/mpeg">
</audio>

<a class="whatsapp"
href="https://wa.me/556496078723?text=Irei%20comparecer%20ao%20culto!"
target="_blank">

<img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">

</a>

<script>

/* MOSTRAR IMAGEM */
function toggleCard(card){
    const img = card.querySelector("img");

    if(img){
        img.classList.toggle("show");
    }
}

/* PLAYER */
function toggleMusic(){

    const audio =
    document.getElementById("audio");

    const btn =
    document.getElementById("musicBtn");

    if(audio.paused){

        audio.play();

        btn.textContent = "Pause";

    }else{

        audio.pause();

        btn.textContent = "Play";
    }
}

/* RELÓGIO */
function updateClock(){

    const now = new Date();

    document.getElementById("clock")
    .textContent =
    "Horário: " +
    now.toLocaleString("pt-BR");
}

setInterval(updateClock,1000);

updateClock();

/* PRÓXIMO CULTO */
document.getElementById("countdown")
.textContent =
"Próximo culto: Terça-feira às 20:00";

/* ESTRELAS */
const canvas =
document.getElementById("stars");

const ctx =
canvas.getContext("2d");

function resize(){

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
}

resize();

window.addEventListener(
"resize",
resize
);

const stars = [];

for(let i=0;i<150;i++){

    stars.push({

        x:Math.random()*
        canvas.width,

        y:Math.random()*
        canvas.height,

        r:Math.random()*1.5,

        s:Math.random()*0.5
    });
}

function animate(){

    ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
    );

    ctx.fillStyle = "white";

    stars.forEach(st=>{

        ctx.beginPath();

        ctx.arc(
        st.x,
        st.y,
        st.r,
        0,
        Math.PI*2
        );

        ctx.fill();

        st.y += st.s;

        if(
            st.y >
            canvas.height
        ){
            st.y = 0;
        }
    });

    requestAnimationFrame(
    animate
    );
}

animate();

</script>

</body>
</html>
